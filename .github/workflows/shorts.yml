name: YouTube Shorts Factory
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: YouTube long video URL (content you own or can republish)
        required: true
        type: string
      upload:
        description: Automatically upload ten Shorts
        type: boolean
        default: false
      privacy:
        description: Upload visibility
        type: choice
        options: [private, unlisted, public]
        default: private
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate ten Shorts
        env:
          VIDEO_URL: ${{ inputs.youtube_url }}
          UPLOAD: ${{ inputs.upload }}
          PRIVACY: ${{ inputs.privacy }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args=()
          if [ "$UPLOAD" = "true" ]; then args+=(--upload); fi
          if [ -z "$VIDEO_URL" ]; then echo "Missing YouTube URL"; exit 1; fi
          python processor.py "$VIDEO_URL" --privacy "$PRIVACY" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: |
            output/short_*/short.mp4
            output/short_*/metadata.json
            output/manifest.json
          retention-days: 3
