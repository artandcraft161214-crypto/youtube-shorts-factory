name: YouTube Shorts Factory
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Authorized YouTube long video URL (or use video_file_url)
        required: false
        type: string
      video_file_url:
        description: HTTPS direct link to your own MP4 file (optional; avoid shared-drive page links)
        required: false
        type: string
      upload:
        description: Automatically upload ten Shorts
        type: boolean
        default: false
      privacy:
        description: Upload visibility
        type: choice
        options: [private, unlisted, public]
        default: private
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno --version
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate ten Shorts
        env:
          VIDEO_URL: ${{ inputs.youtube_url }}
          FILE_URL: ${{ inputs.video_file_url }}
          UPLOAD: ${{ inputs.upload }}
          PRIVACY: ${{ inputs.privacy }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args=()
          if [ "$UPLOAD" = "true" ]; then args+=(--upload); fi
          if [ -n "$FILE_URL" ]; then
            python -c 'import os,urllib.parse; u=urllib.parse.urlparse(os.environ["FILE_URL"]); assert u.scheme=="https" and u.hostname, "video_file_url must be HTTPS"'
            curl --fail --location --retry 2 --max-time 1800 --output source_input.mp4 "$FILE_URL"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 source_input.mp4
            python processor.py --video-file source_input.mp4 --privacy "$PRIVACY" "${args[@]}"
          elif [ -n "$VIDEO_URL" ]; then
            python processor.py "$VIDEO_URL" --privacy "$PRIVACY" "${args[@]}"
          else
            echo "Provide youtube_url or video_file_url"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shorts-output
          path: |
            output/short_*/short.mp4
            output/short_*/metadata.json
            output/manifest.json
          retention-days: 3
